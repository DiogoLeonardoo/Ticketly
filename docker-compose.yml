name: ticketly

services:

  postgres:
    image: postgres:16-alpine
    container_name: ticketly-postgres
    environment:
      POSTGRES_USER: ticketly
      POSTGRES_PASSWORD: ticketly
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ticketly-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: ticketly-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  activemq:
    image: apache/activemq-artemis:latest-alpine
    container_name: ticketly-activemq
    environment:
      ARTEMIS_USER: ticketly
      ARTEMIS_PASSWORD: ticketly
    ports:
      - "61616:61616"   # OpenWire/JMS (usado pelos serviços Java)
      - "8161:8161"     # console web de administração
    volumes:
      - activemq-data:/var/lib/artemis-instance

  minio:
    image: minio/minio:latest
    container_name: ticketly-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ticketly
      MINIO_ROOT_PASSWORD: ticketly123
    ports:
      - "9000:9000"     # API S3-compatível
      - "9001:9001"     # console web
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  activemq-data:
  minio-data:
