# Perfil "docker": o próprio user-service roda como container dentro da
# rede do docker-compose, então acessa a infra pelo nome do serviço
# (resolução de DNS interna do Compose), não por "localhost".
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/user_db
    username: ticketly
    password: ticketly

security:
  jwt:
    secret: "dev-only-docker-jwt-secret-nao-usar-em-producao-1234567890"

logging:
  level:
    com.ticketly: INFO
