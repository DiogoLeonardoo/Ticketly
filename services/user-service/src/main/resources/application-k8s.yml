# Perfil "k8s": nada de credenciais fixas no arquivo. Tudo vem de variáveis
# de ambiente injetadas via ConfigMap/Secret no Deployment (Fase 9).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/user_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

logging:
  level:
    com.ticketly: INFO
